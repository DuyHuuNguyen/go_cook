spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

  application:
    name: go-cook-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

google:
  client-id: ${GOOGLE_CLIENT_ID:162102417756-p89l8j57j99phmgdu7e7psl6hf5vmtmv.apps.googleusercontent.com}

booking:
  chef:
    preparation-duration: PT2H
    response-hold: PT30M
    negotiation-hold: PT2H
    payment-hold: PT30M

logging:
  pattern:
    console: ${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]){faint} %clr(%-5level) %clr(%logger{1}){cyan} %clr(%X{requestId}){yellow} - %clr(%X{email}){green} - %msg%n}
