spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

  application:
    name: go-cook-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

booking:
  chef:
    preparation-duration: PT2H
    response-hold: PT30M
    negotiation-hold: PT2H
    payment-hold: PT30M

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:}
  return-url: ${VNPAY_RETURN_URL:}
  ipn-url: ${VNPAY_IPN_URL:}

logging:
  pattern:
    console: ${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]){faint} %clr(%-5level) %clr(%logger{1}){cyan} %clr(%X{requestId}){yellow} - %clr(%X{email}){green} - %msg%n}
